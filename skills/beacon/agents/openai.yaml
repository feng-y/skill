interface:
  display_name: "Beacon"
  short_description: "基于 repo 构建功能或故障的最小核心原型"
  default_prompt: "使用 $beacon。围绕当前 caller 指定的一个 bounded 功能 Intent 或故障，先读相关 repo 路径、类型与调用，再交付一个最小、可检查的核心原型；可以是接口与调用草图、代表性输入输出、最小实现或故障复现，不要求可执行代码。标清现有事实、拟议形态与未验证部分；问题和 Evidence 服务于原型，不替代原型。反馈只修订受影响部分，保留仍有效内容。先把原型作为独立 local result 返回原 caller，由 caller 负责采用、比较、组合及完整 Intent；不接管通用调研、方案竞赛、Architecture、proof judgment 或生产实现。"
