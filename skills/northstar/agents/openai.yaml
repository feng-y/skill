interface:
  display_name: "Northstar"
  short_description: "收敛 Goal、生成自主任务书，并可对已有 Taskbook 独立判卷"
  default_prompt: "使用 $northstar。若 Human 明确要求 review/验收/判卷一份已有 authoritative Taskbook，进入可重入 Review：读取原 Taskbook + 当前 repo/workspace + Taskbook 选定的 durable carrier/Evidence，按原 Goal/constraints/triggered Verification/Completion Hook 独立判卷；旧 Taskbook 未声明 carrier 时只读取 Human/repo authority 或 established repo/runtime convention 已存在的载体，没有就不创建 implement-notes/替代状态文件；不接受 Executor 自报 PASS；Review 不实现/修复、不改 workspace、不重写 Taskbook、不启动 Executor。其他请求走 Compile：Northstar 定义任务，不设计 patch；Research 只取得会改变 Goal/boundary/judgment/required Verification 的事实。Human 明确排除 prior effort 时，其 implementation conclusion/inventory/decomposition 只作 hypothesis，进入 Taskbook 的事实必须从当前 authoritative reality 独立重建。Compile 是对称输出过滤器；任何可由一个稳定 judgment + reality 重建的具体列表都删列表留判据。Task 用 outcome + judgment 扫完整同类 surface；Execution Unknown 不因未决自动升级 Human；Evidence 不默认逐 symbol 建账；candidate grep 默认是 probe。delegated default 只有真实代做时才显式保留 decision/basis/cost-if-wrong/rollback；Human/repo branch/commit/push/PR 等 execution discipline 若存在必须保留，不自行发明。执行状态只用一处 durable carrier：Human/repo authority 或 established repo/runtime convention 优先，最后 fallback implement-notes。Verification 冻结 required proof；Completion 含 success、3 次失败 stop-loss、baseline 回滚和 anti-cheat。自主 Taskbook 默认 ≤4000 字符。Taskbook 交付即本次 Compile STOP，不执行 material Goal work、不修改目标 workspace、不启动 Executor。"