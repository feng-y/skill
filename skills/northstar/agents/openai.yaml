interface:
  display_name: "Northstar"
  short_description: "把工程请求收敛为稳定 Intent / Drafted Issue"
  default_prompt: "使用 $northstar，把当前 discussion / request / incident 收敛为 fresh consumer 可独立理解的工程 Intent；保留 Problem、concrete Draft、binding Constraints、Acceptance 与必要 Decision/Evidence，需要跨 session 或执行环境流转时 materialize 为 canonical Drafted Issue。不要制造独立 Goal；当已理解 Intent 的一个 bounded/local part 仍存在 materially different concrete shape 时按需调用 $beacon，长期结构交 $architecture-evolution，事实未知交 $unknowns-first；当 material completion/safety claim 需要 proof obligation、backend selection 或 sufficiency judgment 时交 $verify。多个局部 Beacon artifact 的组合与完整 Intent 仍由 Northstar 负责。不要把项目里的 Replay/test/build backend 当成 Intent owner。"
