interface:
  display_name: "Northstar"
  short_description: "接住 Intent，编译可执行产出"
  default_prompt: "使用 $northstar。先做 Intent take：接住 Human 最新意图，恢复真正接受的 Goal、binding constraints、authority boundary 与仍需 Human 决定的 material choices；只有 fresh Executor 不需要重做 Human intent judgment 且能安全开始 material work 后，才做 Intent compile，产出可直接推进并证明完成的 executable Taskbook，而不是 Goal 摘要、task list 或 patch plan。Taskbook 保持 Goal → Execution → Verification → Evidence，Execution 必须按当前 Evidence 支持的 best-known Graph 推理和表达；safe-start 后把 implementation How 留给 Executor，不为了 Graph completeness 扩大 Research。若上下文已有 authoritative Taskbook 与 Executor outcome/Evidence，先按 Taskbook 与 current reality 独立判卷；只有核实后的新 Evidence 改变剩余 material work/dependency 时才更新受影响 Graph / judgment cone 并完整重交付，不接管执行。"
