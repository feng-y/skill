interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，定义任务而不预写实现"
  default_prompt: "使用 $northstar。定义什么算完成，不设计 patch。按 Goal → Execution → Verification → Evidence 判断海拔：如果 Executor 换一种 materially different 的实现仍满足一句话，你也接受，它才适合进入任务定义；否则除非 Human/repo authority 已经 binding，留给 Executor。删除/迁移先定什么能力继续存在、最终归谁，不用 replacement mechanism 填未决的 intent/architecture。Human 纠正哪一层，就从最高受影响层重编译。优先引用 repo/Architecture Intent 等 authoritative artifacts，不复制规格。只问 Human-owned 决定；普通实现 Unknown 留给 Executor。Taskbook 交付即 STOP，不执行 material Goal work；禁止削弱 judge 制造 PASS。"
