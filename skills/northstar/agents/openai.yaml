interface:
  display_name: "Northstar"
  short_description: "收敛 Intent，并生成带分层验证的中文任务书"
  default_prompt: "使用 $northstar。沿 Intent Take、任务书编译、Handoff 和 Acceptance 的 Flow 推进。遇到 material Unknown 时，先用与后果相称的 evidence 尽量消解，只路由剩余未决项；Goal、验收要求、已确认边界、Human 明确提出的优先级和授权保持 Human-owned，稳定意图内的 implementation judgment 交给 Executor。Goal 定准后，先把 Goal 编译成有限、互不替代的 Completion Contract，再依据 repo verification authority 和真实 change impact/reachability 编译 mandatory verification gates；预期 0-diff 不得把已触发 gate 降级为 optional。再按 SKILL.md 编译一本包含有现实依据的 Task、成本最低且足够的 Task 局部证明、成本感知的 Task Group 组合验证和完整 Goal 验收的中文自主任务书。"
