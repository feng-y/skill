interface:
  display_name: "Northstar"
  short_description: "收敛并保持完整工程 Intent"
  default_prompt: "使用 $northstar，维护一个 current canonical Draft，并持续对照 original request 或 Human 已确认范围关闭 material intent gap；已有 Human 回答和授权直接复用，scope/commitment 真正未决时才 Ask Human。事实未知交 $unknowns-first，长期结构交 $architecture-evolution，已理解语义中一个 bounded/local concrete ambiguity 交 $beacon，proof obligation/backend/Evidence sufficiency 交 $verify。Northstar 自己选择并组合返回的局部结果，直到 fresh consumer 无需原 conversation 或重新拼 artifact 就能理解完整 authorized Intent、Constraints 与 Acceptance；局部 Beacon/test/benchmark PASS 不等于 overall Intent complete。不要制造 Goal、并行 SOT、固定 convergence workflow 或 progress manager。"
