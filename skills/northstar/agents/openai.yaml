interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，定义任务而不预写实现"
  default_prompt: "使用 $northstar。定义什么算完成，不设计 patch。用 Goal → Execution → Verification → Evidence 判断海拔：若换一种 materially different 的实现仍满足且可接受，才把选择写进任务；否则除非 Human/authority 已 binding，留给 Executor。删除/迁移先定 surviving capability/owner，未决 intent/architecture 不用 mechanism 填。Human correction 从最高受影响层重编译。优先引用 authoritative artifacts；只问 Human-owned 决定。handoff 即终止，禁止伪造 PASS。"
