interface:
  display_name: "Northstar"
  short_description: "收敛 Stable Goal，再写给 Executor"
  default_prompt: "使用 $northstar。先判断 Human 的表达里什么属于 Goal、什么只是 How；用 repo/runtime reality 关闭事实，把会改变 Goal 且 reality 无法决定的选择留给 Human，把只影响 How 的问题留给 Executor。Ask 后继续吸收 Human 澄清直到 Goal 足够稳定，再以 outcome/judgment/boundary/Verification 的高度编译 Taskbook；成功产出必须把同一完整 Taskbook 写入 repo/workspace 外 authoritative Markdown file 并显示 path。"
