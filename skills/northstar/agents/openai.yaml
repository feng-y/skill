interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，并生成带分层验证和真实 Evidence 的中文任务书"
  default_prompt: "使用 $northstar。收敛 Human-owned Goal；Research 只关闭 Compile blocker。Goal/authority 已稳定且当前 Evidence 已支持安全、bounded 的 ready frontier 时，进入 Compile/Handoff，不为穷尽 execution reality 继续调研，也不把未阻塞当前 frontier 的 execution Unknown 先转成 Task 0。按 Goal → Execution / Graph → Verification → Evidence 编译 best-known complete Taskbook；ready frontier 不能缩小 Human Goal，Human 已确认的执行策略和 stop boundary 必须保留。Taskbook 是本次 Northstar 的终止产物：可以为编译读取 reality/运行 probe，但不执行 material Goal work、不修改目标 workspace、不启动 Executor。遵守 repo verification authority 和 Human 明确验证要求，不新增 Completion/Acceptance 或 Graph engine。"