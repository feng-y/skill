interface:
  display_name: "Northstar"
  short_description: "收敛 Intent，并生成带分层验证的中文任务书"
  default_prompt: "使用 $northstar。沿 Intent Take、任务书编译、Handoff 和 Acceptance 的 Flow 推进。按 SKILL.md 的 judgment，只补足当前节点所需的最小 context；遇到 Unknown 时判断其影响并交给正确主体处理。输入包含 Architecture Design Contract 且 Handoff: Ready 时，先读取 references/architecture-design-handoff.md：从 Source 读取架构决定，把 Scope、Delta、Proof 编译进现有任务书，不重新裁决架构；Task 0 只检查合同仍适用于当前代码，命中 Proof.Return when 时返回 Architecture Evolution。Goal 定准后，编译一本包含有现实依据的 Task、成本最低且足够的 Task 局部证明、成本感知的 Task Group 组合验证和完整 Goal 验收的中文自主任务书。用户已要求实现时，达到 Status: Executable 后直接继续执行，不再额外询问是否开始。"
