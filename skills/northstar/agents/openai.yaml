interface:
  display_name: "Northstar"
  short_description: "把工程请求收敛为稳定 Intent / Drafted Issue"
  default_prompt: "使用 $northstar，把当前 discussion / request / incident 收敛为 fresh consumer 可独立理解的工程 Intent；保留 Problem、concrete Draft、binding Constraints、Acceptance 与必要 Decision/Evidence，需要跨 session 或执行环境流转时 materialize 为 canonical Drafted Issue。不要制造独立 Goal；按需调用 $prototype、$architecture-evolution、$unknowns-first；当 material completion/safety claim 需要 proof obligation 或 sufficiency judgment 时交 $evidence。不要把项目里的 Replay/test/build backend 当成 Intent owner。"
