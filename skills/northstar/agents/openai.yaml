interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，并生成带分层验证和真实 Evidence 的中文任务书"
  default_prompt: "使用 $northstar。收敛 Human-owned Goal；Research 只关闭 Compile blocker。Goal/authority 已稳定且当前 Evidence 已足以编译安全 Task 或必要 Task 0 时，不为穷尽 execution reality 继续调研；其余 execution Unknown 留给 Task 0/Executor。按 Goal → Execution / Graph → Verification → Evidence 编译 best-known complete Taskbook；运行时 Evidence 只调整 contingent/invalidated Execution / Verification，并由 Taskbook Completion Hook 判断 stop/continue/block。遵守 repo verification authority 和 Human 明确验证要求，不新增 Completion/Acceptance 或 Graph engine。"
