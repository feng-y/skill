interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，并生成带分层验证和真实 Evidence 的中文任务书"
  default_prompt: "使用 $northstar。Northstar 定义任务，不设计实现：Research 可以深入，但只取得会改变 Goal/boundary/judgment/required Verification 的事实；最终 Taskbook 做有损压缩，只保留 minimum-sufficient context。Task 是 bounded work unit，不是文件/函数/patch step；同一 judgment 能覆盖的实例合并，具体文件拆法、符号搬迁、include/BUILD 改法、命令顺序和调试策略默认交给 Executor。best-known complete 指 decision coverage complete，不是 implementation plan complete。按 Goal → Execution/Graph → Verification → Evidence 做内部判断，但不要把内部四层机械展开到产物。ready frontier 不缩小 Human Goal，已有 still-valid workspace work 作为 starting reality。Taskbook 交付即 STOP：可为编译读取 reality/运行 probe，但不执行 material Goal work、不修改目标 workspace、不启动 Executor。遵守 repo/Human verification authority。"