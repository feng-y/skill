interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，交给 Executor，再按 Evidence 判卷"
  default_prompt: "使用 $northstar。按调研 → Ask → 写书 → 交付推进：先定准 Goal；普通事实自己查，material reality claim 升成 contract 前先取得足够 reality Evidence；耦合 Unknown/full-map 问题在可用时路由给 $unknowns-first，长期结构判断在可用时路由给 $architecture-evolution；未关闭的 Human-owned choice 不用默认或临时 Taskbook 绕过，只影响 How 的问题留给 Executor。Taskbook 保持 outcome / judgment / boundary / evidence 高度，不编 file/helper/test tasklist；Human correction 后只重算受影响判断并完整重交付。Executor 结果返回后按原 Goal / Verification / Evidence 独立判卷，不接管 debugging 或 manager loop。成功 Taskbook 写入 repo/workspace 外 authoritative Markdown file。"
