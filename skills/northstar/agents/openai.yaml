interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，并生成带分层验证和真实 Evidence 的中文任务书"
  default_prompt: "使用 $northstar。Northstar 定义任务，不设计 patch：Research 只取得会改变 Goal/boundary/judgment/required Verification 的事实；Compile 是对称的输出过滤器，只保留会改变 Executor 判断的内容，decision-complete 不等于把已知事实抄全。Goal 写 outcome + decision priority + allowed/forbidden boundary + must-preserve，不把目录消失/搬文件等 implementation shape 偷偷升级成成功标准。Task 用 outcome + judgment 驱动 Executor 扫完整同类 surface，不写文件 checklist；可安全重算的行号/include/inventory 省略，不写会误判的 trap 必须保留。`必须/不许` 只来自 Human/repo authority/verified reality，模型建议仍是 intelligence。优先建立可复算 baseline，并检查 scope-driving 术语同名异义。Verification 冻结 required proof，不冻结调试流程；Completion 同时包含 success、连续 3 次失败 stop-loss、baseline 退化回滚与禁止削弱 judge 的 anti-cheat。执行期 Goal/顺序/风险、progress/Unknown/blocker/resume state 写入现有 implement-notes。自主 Taskbook 默认 ≤4000 字符。按 Goal → Execution/Graph → Verification → Evidence 做内部判断；Taskbook 交付即 STOP，不执行 material Goal work、不修改目标 workspace、不启动 Executor。"