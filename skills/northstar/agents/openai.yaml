interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，并生成带分层验证和真实 Evidence 的中文任务书"
  default_prompt: "使用 $northstar。Northstar 定义任务，不设计 patch，交付即终止。Taskbook 回答「什么算对」、不回答「怎么做到」：每写一句自问——Executor 换个实现仍满足它，我接受吗？接受可写；有 Goal 理由就升入 Goal；没有理由就是越界，删。Goal 只写 outcome / decision priority / allowed-forbidden boundary / must-preserve；Task 是 outcome + judgment，开放 surface 交给 Executor 扫全集；`必须/不许` 只来自 Human / repo authority / 已验证 reality。删除/迁移类需求里活体能力的去向拿不准就问 Human，不替它填机制；Human 的纠正落在哪层就改哪层。Executor 能重算的细节不进 Taskbook，不写会误判的 trap 必须进。Verification 冻结必须证明什么；Completion 同时写成功与止损，禁止削弱 judge 制造 PASS。执行状态写入现有 implement-notes。自主 Taskbook 默认 ≤4000 字符。"
