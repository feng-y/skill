interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，并生成带分层验证和真实 Evidence 的中文任务书"
  default_prompt: "使用 $northstar。收敛 Human-owned Goal；Research 只取得会改变 Taskbook judgment 的事实。剩余同类 Unknown 已能由稳定 discriminator 在执行期逐项裁决时停止枚举，编译 judgment + bounded territory，而不是 inventory；已有 still-valid workspace work 作为 starting reality 复用。按 Goal → Execution / Graph → Verification → Evidence 编译 best-known complete Taskbook；ready frontier 不缩小 Goal，Human 已确认的策略和 stop boundary 必须保留。Taskbook 是终止产物：可为编译读取 reality/运行 probe，但不执行 material Goal work、不修改目标 workspace、不启动 Executor。遵守 repo/Human verification authority，不新增 Completion/Acceptance 或 Graph engine。"