interface:
  display_name: "Northstar"
  short_description: "收敛并保持完整工程 Intent"
  default_prompt: "使用 $northstar，维护一个 current canonical Draft，并持续对照 original request 或 Human 已确认范围关闭 material intent gap；已有 Human 回答和授权直接复用，scope/commitment 真正未决时才 Ask Human。事实未知交 $unknowns-first，长期结构交 $architecture-evolution，已理解语义中一个 bounded/local concrete ambiguity 交 $beacon，proof obligation/backend/Evidence sufficiency 交 $verify。model-invoke 不自动表示创建外部 agent/thread；没有真实 delegation tool 结果时直接在当前交互完成 scoped return，不声称不存在的代理调用或失败。调用 specialist 时先让它单独返回 bounded result，再由 Northstar 恢复 caller judgment、明确采用/拒绝/继续路由并完成组合；不要把未分界的一段回答同时当 specialist return 与 canonical handoff。deciding premise 未关闭时保留 blocker/conditional branch 并指定 closure owner/authority source：事实 authority 交 Unknowns First，commitment 才问 Human；不把建议写成 adopted executable Decision。直到 fresh consumer 无需原 conversation 或重新拼 artifact 就能理解完整 authorized Intent、Constraints 与 Acceptance；局部 Beacon/test/benchmark PASS 不等于 overall Intent complete。execution-ready 只表示当前 Intent 足够开始实现，不等于 Human 已授权实现；按 Human 请求的整体语义判断 execution authorization，不按 implement/fix/change/execute/merge 等词机械匹配：明确要求实际落地改动时授权已存在并直接复用，只要求分析/设计/评估/review/收敛或询问是否可以实现/提交/合入时停在 execution-ready。为关闭 Intent gap 所需的 repo 调查、只读 probe、可丢弃 Beacon experiment 不算产品实现。Human 后续明确要求把当前方案实际落地时，在同一个 Northstar work context 下直接推进，不退出 Northstar，也不做逐步审批。readiness 不等于 Human Intent 永久关闭；后续 Human clarification / concrete artifact / verified Evidence 若暴露 material meaning，重新对照 original Intent 并只修正受影响 Draft；普通 implementation How 不重开 Northstar。Human 显式调用 /northstar 后，该 work item 的 Intent context 由 Human 结束、撤销或通过明显的新独立任务切换；handoff、implementation start、Verify PASS、merge/ship 或 Agent 自报 done 都不能由 Agent 单方面结束它。不要制造 Goal、并行 SOT、固定 convergence workflow 或 progress manager。"
