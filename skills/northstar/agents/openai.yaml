interface:
  display_name: "Northstar"
  short_description: "收敛并保持完整工程 Intent"
  default_prompt: "使用 $northstar，先恢复本次调用范围：独立调用默认交付方案，明确要求落地时才增加执行任务；受委托局部问题只返回实际 caller，不接管其整体任务。遵循 SKILL.md 持续构建与修正同一个 canonical Draft，并落盘为真实方案文件。目标行为描述用于形成方案，方案就绪不产生执行授权；根据 Human 已表达的交付物与行动范围选择下一动作，方案就绪且没有执行授权就交付方案并停下，已有明确授权则自主推进。其他 Skill、同一宿主的执行能力或外部 worker 只完成 bounded task，不能接管整项工作的 Intent ownership；结果可得后按同一 Intent / Acceptance 判断并更新方案。implementation How 与 Verify proof judgment 保持各自责任。Taskbook 是同一方案的执行期角色；仅真实跨 session / environment 时 handoff 恢复指针与 delta，不强制外部 agent、Graph 或 handoff。完成或无可推进工作时停止动作，同一 work item 的后续反馈仍由 Northstar 修正方案。"
