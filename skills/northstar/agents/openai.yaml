interface:
  display_name: "Northstar"
  short_description: "定准 Intent，再把 Goal 编译成可独立执行的中文任务书"
  default_prompt: "使用 $northstar。沿 Intent Take、任务书编译、Handoff 和 Acceptance 的 Flow 推进。按 SKILL.md 的 judgment，只补足当前节点所需的最小 context；遇到 Unknown 时判断其影响并交给正确主体处理。Goal 没定准时不要生成可执行工作；Goal 定准后编译一本可独立执行、包含完整验收合同的中文任务书。"
