interface:
  display_name: "Northstar"
  short_description: "收敛 Goal，并生成带分层验证和真实 Evidence 的中文任务书"
  default_prompt: "使用 $northstar。先定准 Human-owned Goal；Human 明确验证要求作为 Verification 的 binding input 单独保留。按 Goal → Execution / Graph → Verification → Evidence 编译：Task 0 仅在主要执行前关闭少量高价值 Unknown 能显著改善 grounding、路线判断、稳定性或 required Verification 时使用，并在 Evidence 已足以安全开始时停止；Handoff 只物化当前证据支持的 Execution/Graph。运行时执行 ready work，在适用边界 Verification，记录可复核 Evidence，并让 PASS/FAIL Evidence 修正受影响的剩余 Task/edge/frontier、Verification 或 Evidence freshness；required verification 根据真实 impact/reachability、repo verification authority 和 Human 明确要求确定，0-diff、cleanup 或 refactor 不得降级已触发验证；最终只依据仍有效且覆盖真实 affected surface 的 Evidence 判断继续或停止。不要创建 Completion Contract、Acceptance layer、Graph engine 或固定 Acceptor 角色。"