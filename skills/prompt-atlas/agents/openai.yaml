interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Settle the Human-owned Goal; Research closes only Compile blockers. Once Goal/authority is stable and current Evidence supports a safe bounded ready frontier, enter Compile/Run directly instead of exhausting execution reality or moving non-blocking execution Unknown into Task 0; obtain Evidence only when an Unknown actually affects current ready work. Compile the best-known complete Taskbook along Goal → Execution / Graph → Verification → Evidence; runtime Evidence adjusts only contingent/invalidated Execution / Verification, and the Taskbook Completion Hook decides stop/continue/block. Follow repo verification authority and explicit Human verification requirements. Do not add Completion/Acceptance layers or a Graph engine."
