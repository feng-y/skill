interface:
  display_name: "Prompt Atlas"
  short_description: "收敛 Intent，并生成带分层验证的自主任务书"
  default_prompt: "Use $prompt-atlas. Route Unknown by consequence and never emit executable work from unresolved intent. Keep the stable chain Goal → Execution/Graph → Verification → Evidence. Let Goal define success directly; do not add Completion/Acceptance layers. Compile the best-known execution graph from real dependencies, let runtime Evidence revise the remaining frontier, derive Task/Task-Group/Goal verification from repo authority plus real impact/reachability and any explicit Human verification requirements, and judge the result only from still-valid Evidence."
