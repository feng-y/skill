interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Prompt Atlas defines the task; it does not design the patch. Research only facts that change Goal/boundary/judgment/required Verification; Compile keeps only facts that change Executor decisions. Goal states outcome + decision priority + allowed/forbidden boundary + must-preserve. Tasks are outcome + judgment units over the full same-shaped surface, not file checklists; ordinary technical Unknowns stay with the Executor when Goal/boundary/priority already support a safe decision. Omit safely recomputable line/include/inventory detail and preserve traps whose omission would cause wrong judgment. `must/must not` comes only from Human/repo authority/verified reality. Evidence proves judgment and the completion claim rather than defaulting to per-file/per-symbol ledgers. Establish reproducible baselines; Verification freezes required proof, not debugging workflow. Completion includes success, a three-failure stop-loss, trusted-baseline rollback, and anti-cheat. Persist execution state in existing implement-notes. Autonomous Taskbooks default to ≤4000 characters. Taskbook delivery is terminal: do not perform material Goal work, mutate the target workspace, or launch an Executor. Treat required Verification as the visible exam and keep 2–3 independent hidden spot checks outside the Taskbook. When the Human returns, rerun visible + hidden checks and report in ≤5 lines; the Executor does not grade itself, and an independent acceptance-agent prompt is only the fallback when the execution environment is inaccessible."
