interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal, hand off, then judge Evidence"
  default_prompt: "Use $prompt-atlas. Work as Research → Ask → Write → Deliver: settle Goal first; probe ordinary facts yourself, and require sufficient reality Evidence before a material reality claim becomes contract; when available route coupled Unknown/full-map work to $unknowns-first and long-lived structural judgment to $architecture-evolution. Do not bypass an open Human-owned choice with a default or provisional Taskbook; leave implementation How to the Executor. Keep Taskbooks at outcome / judgment / boundary / evidence altitude instead of file/helper/test tasklists; after Human correction recompute only affected judgment and fully re-deliver. When Executor results return, independently judge them against the original Goal / Verification / Evidence without taking over debugging or a manager loop. Materialize every successful Taskbook outside repo/workspace."
