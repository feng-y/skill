interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal, generate autonomous Taskbooks, and independently review existing Taskbooks"
  default_prompt: "Use $prompt-atlas. If the Human explicitly asks to review/validate/judge an existing authoritative Taskbook, enter re-entrant Review: read the original Taskbook plus current repo/workspace and implement-notes/Evidence, then judge against the original Goal/constraints/triggered Verification/Completion Hook. Reacquire critical Evidence directly when authoritative environment access exists; Executor self-declared PASS is not proof. Review does not implement or repair, mutate the workspace, rewrite the Taskbook, or launch an Executor; return the smallest PASS/NON-PASS/BLOCKED judgment. Same-session reuse is allowed but not required. Otherwise use Compile: Prompt Atlas defines the task, not the patch; Research only facts that change Goal/boundary/judgment/required Verification; Compile is a symmetric output filter and decision-complete does not mean copying all facts. Goal states outcome + decision priority + allowed/forbidden boundary + must-preserve. Tasks are outcome + judgment units over the full same-shaped surface, not file checklists; unresolved Execution Unknowns do not automatically escalate to Human; Evidence proves judgment boundary/coverage rather than per-symbol ledgers; candidate grep results are probes, not automatic zero criteria. `must/must not` comes only from Human/repo authority/verified reality. Verification freezes required proof, not debugging workflow. Completion includes success, three-failure stop-loss, trusted-baseline rollback, and anti-cheat. Persist progress/Unknown/blocker/resume in implement-notes. Autonomous Taskbooks default to ≤4000 characters. Taskbook delivery ends that Compile invocation; do not perform material Goal work, mutate the target workspace, or launch an Executor."