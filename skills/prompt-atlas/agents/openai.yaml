interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Settle the Human-owned Goal. Research closes only Compile blockers: once Goal/authority is stable, at least one safe Task or necessary Task 0 can be compiled, and Verification authority/trigger is clear enough to leave concrete scope/provider/target to execution, stop Research and enter Compile/Run instead of trying to exhaust repo/dependency/reachability knowledge. Then compile the best-known complete Taskbook supported by current Evidence along Goal → Execution / Graph → Verification → Evidence. Use Task 0 only as an on-demand bounded warmup. At runtime, let Evidence adjust only contingent or invalidated Execution / Verification, and apply the Taskbook Completion Hook to decide completion or continuation. Follow repo verification authority and explicit Human verification requirements. Do not add Completion/Acceptance layers or a Graph engine."
