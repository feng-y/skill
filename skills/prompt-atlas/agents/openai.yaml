interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Prompt Atlas defines the task; it does not design the implementation. Research may be deep, but obtain only facts that change Goal/boundary/judgment/required Verification, then compress them into a minimum-sufficient Taskbook. A Task is a bounded work unit, not a file/function/patch step; group instances covered by one judgment, and leave file decomposition, symbol moves, include/BUILD rewrites, command order, and debugging tactics to the Executor by default. best-known complete means decision coverage complete, not implementation plan complete. Use Goal → Execution/Graph → Verification → Evidence as internal compiler semantics rather than mechanically exposing four layers in the artifact. The ready frontier must not narrow the Human Goal; still-valid workspace work is starting reality. Taskbook delivery is terminal: reality inspection/probes are allowed for compilation, but do not perform material Goal work, mutate the target workspace, or launch an Executor. Follow repo/Human verification authority."