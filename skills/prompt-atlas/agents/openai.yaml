interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Settle the Human-owned Goal; Research closes only Compile blockers. Once Goal/authority is stable and current Evidence supports a safe bounded ready frontier, enter Compile/Handoff instead of exhausting execution reality or moving non-blocking execution Unknown into Task 0. Compile the best-known complete Taskbook along Goal → Execution / Graph → Verification → Evidence; the ready frontier must not narrow the Human Goal, and Human-confirmed execution strategy / stop boundary must be preserved. The Taskbook is the terminal artifact of this Prompt Atlas invocation: reality inspection and compile-time probes are allowed, but do not perform material Goal work, mutate the target workspace, or launch an Executor. Follow repo verification authority and explicit Human verification requirements. Do not add Completion/Acceptance layers or a Graph engine."