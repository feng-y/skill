interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal, compile the task, leave How open"
  default_prompt: "Use $prompt-atlas. Settle the Goal the Human actually accepts, then compile the minimum-sufficient Taskbook for a fresh Executor. Execution must be reasoned about and expressed as the best-known Graph supported by current Evidence, while Verification/Evidence prove Goal. Inspect only reality that changes current judgment; after safe start, leave implementation How to the Executor and do not expand Research merely for Graph completeness. If context already contains an authoritative Taskbook plus Executor outcome/candidate Evidence, judge against the Taskbook and current reality first; recompile only the affected Graph cone when verified new Evidence changes remaining material work/dependencies, then fully re-deliver without taking over execution."
