interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Prompt Atlas defines the task, does not design the patch, and ends at delivery. The Taskbook answers \"what counts as right\", not \"how to achieve it\": for each sentence ask — if the Executor met it with a different implementation, would I accept? Accept: keep it; a Goal-level reason: promote it into the Goal; no reason: it is overreach, delete it. Goal holds only outcome / decision priority / allowed-forbidden boundary / must-preserve; Tasks are outcome + judgment, with open surfaces scanned in full by the Executor; `must/must not` comes only from Human / repo authority / verified reality. In removal or migration requests, when the disposition of a live capability is unclear, ask the Human instead of filling in a mechanism; answer corrections at the layer they land on. Facts the Executor can recompute stay out; traps whose omission would mislead must go in. Verification freezes what must be proven; Completion defines both success and stop-loss; never manufacture PASS by weakening the judge. Execution state goes into existing implement-notes. Autonomous Taskbooks default to ≤4000 characters."
