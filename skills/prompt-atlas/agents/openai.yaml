interface:
  display_name: "Prompt Atlas"
  short_description: "Take intent, compile executable output"
  default_prompt: "Use $prompt-atlas. First perform Intent take: absorb the Human's latest intent, close only ambiguity that can change the executable contract, and recover the Goal they actually accept, binding constraints, authority boundaries, and material choices that still require Human authority; do not exhaustively specify questions that cannot change the contract. Only when a fresh Executor no longer needs to redo Human intent judgment and can safely begin material work, perform Intent compile: define the executable Taskbook contract first, then use a Graph only to structure its Execution; the Graph must not determine Intent/Goal/binding constraints in reverse. The Taskbook keeps Goal → Execution → Verification → Evidence. After safe start, leave implementation How to the Executor and do not expand Research merely for Graph completeness. If context already contains an authoritative Taskbook plus Executor outcome/Evidence, judge against the Taskbook and current reality first; only verified new Evidence that changes remaining material work/dependencies may update the affected Graph / judgment cone and trigger full re-delivery without taking over execution."
