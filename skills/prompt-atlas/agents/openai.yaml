interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and define the task without prewriting implementation"
  default_prompt: "Use $prompt-atlas. Define what completion means; do not design the patch. Use Goal → Execution → Verification → Evidence as semantic altitude: a statement belongs in the task when a materially different implementation could still satisfy it and remain acceptable; otherwise keep the choice out unless Human/repo authority already makes it binding. For removal/migration, settle what capability survives and who owns it before execution; do not fill unresolved intent/architecture with a replacement mechanism. Re-enter at the highest layer changed by Human correction. Prefer authoritative repo/Architecture Intent artifacts over prose duplication. Ask only for Human-owned decisions; ordinary implementation Unknowns stay with the Executor. Taskbook delivery is terminal; never weaken the judge to manufacture PASS."
