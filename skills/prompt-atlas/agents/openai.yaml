interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Settle the Human-owned Goal, then compile the best-known complete Taskbook supported by current Evidence along Goal → Execution / Graph → Verification → Evidence. Use Task 0 only as an on-demand bounded warmup. At runtime, let Evidence adjust only contingent or invalidated Execution / Verification, and apply the Taskbook Completion Hook to decide completion or continuation. Follow repo verification authority and explicit Human verification requirements. Do not add Completion/Acceptance layers or a Graph engine."
