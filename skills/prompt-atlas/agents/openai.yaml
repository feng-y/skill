interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Settle the Human-owned Goal; Research closes only Compile blockers. Once Goal/authority is stable and current Evidence is enough to compile a safe Task or necessary Task 0, do not keep researching to exhaust execution reality; leave remaining execution Unknown to Task 0/the Executor. Compile the best-known complete Taskbook along Goal → Execution / Graph → Verification → Evidence; runtime Evidence adjusts only contingent/invalidated Execution / Verification, and the Taskbook Completion Hook decides stop/continue/block. Follow repo verification authority and explicit Human verification requirements. Do not add Completion/Acceptance layers or a Graph engine."
