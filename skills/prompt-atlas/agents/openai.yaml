interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal, then write for the Executor"
  default_prompt: "Use $prompt-atlas. Work as Research → Ask → Write → Deliver: settle Goal first; trace cross-boundary artifact authority/provenance/lifecycle and every route-changing input to composed runtime decisions through the real workflow, and probe ordinary facts yourself; when available route coupled Unknown/full-map work to $unknowns-first and long-lived structural judgment to $architecture-evolution. Treat Ask as a host-independent gate and deliver the current frontier as a decision packet of at most 5 choices with minimum sufficient Evidence, credible mutually exclusive options, consequences/recommendations, and compact reply syntax; leave implementation How to the Executor. After a Human correction, recompute its dependency cone, reconcile latest constraints, and do not reopen unrelated settled choices; fold specialist results into the same Goal/Taskbook, keep outcome/judgment/boundary/Verification altitude, and materialize every successful Taskbook outside repo/workspace."
