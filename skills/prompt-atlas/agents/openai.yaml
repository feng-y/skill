interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Settle the Human-owned Goal; Research only facts that can change Taskbook judgment. Once same-shaped remaining Unknowns can be decided at runtime by one stable discriminator, stop enumerating and compile judgment + bounded territory instead of inventory; reuse still-valid workspace work as starting reality. Compile the best-known complete Taskbook along Goal → Execution / Graph → Verification → Evidence; the ready frontier must not narrow the Goal, and Human-confirmed strategy / stop boundary must be preserved. The Taskbook is the terminal artifact: reality inspection and compile-time probes are allowed, but do not perform material Goal work, mutate the target workspace, or launch an Executor. Follow repo/Human verification authority. Do not add Completion/Acceptance layers or a Graph engine."