interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal, compile the task, leave How open"
  default_prompt: "Use $prompt-atlas. Settle the Goal the Human actually accepts, then compile material work supported by current Evidence into the best-known Execution Graph a fresh Executor can advance, with necessary Verification/Evidence obligations. Inspect only reality that changes current judgment; after safe start, leave implementation How to the Executor. If context already contains an authoritative Taskbook plus Executor outcome/Evidence, judge against that same contract and current reality first; recompile only the affected Graph cone when new Evidence changes remaining material work/dependencies, then fully re-deliver without taking over execution."
