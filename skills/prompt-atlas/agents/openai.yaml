interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Prompt Atlas defines the task; it does not design the patch. Research only facts that change Goal/boundary/judgment/required Verification; Compile is the symmetric output filter and keeps only facts that change Executor decisions. Decision-complete does not mean copying all known facts. Goal states outcome + decision priority + allowed/forbidden boundary + must-preserve, and must not silently promote directory disappearance/file moves or other implementation shape into success. Tasks are outcome + judgment units that drive the Executor to scan the full same-shaped surface, not file checklists. Omit safely recomputable line/include/inventory detail; preserve traps whose omission would cause wrong judgment. `must/must not` comes only from Human/repo authority/verified reality; model recommendations remain intelligence. Establish reproducible baselines and check repo-local terminology collisions. Verification freezes required proof, not debugging workflow. Completion includes success, a three-failure stop-loss, rollback when a trusted green baseline regresses, and anti-cheat rules forbidding judge weakening. Persist Goal/order/risk and execution progress/Unknown/blocker/resume state in existing implement-notes. Autonomous Taskbooks default to ≤4000 characters. Use Goal → Execution/Graph → Verification → Evidence as internal compiler semantics. Taskbook delivery is terminal: do not perform material Goal work, mutate the target workspace, or launch an Executor."