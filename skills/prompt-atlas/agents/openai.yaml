interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal, generate autonomous Taskbooks, and independently review existing Taskbooks"
  default_prompt: "Use $prompt-atlas. If the Human explicitly asks to review/validate/judge an existing authoritative Taskbook, enter re-entrant Review: read the original Taskbook plus current repo/workspace and the Taskbook-selected durable carrier/Evidence, then judge against the original Goal/constraints/triggered Verification/Completion Hook. If an older Taskbook names no carrier, reuse Human/repo or existing runtime state first and fall back to implement-notes only when none exists. Executor self-declared PASS is not proof. Review does not implement or repair, mutate the workspace, rewrite the Taskbook, or launch an Executor. Otherwise use Compile: Prompt Atlas defines the task, not the patch. Research only facts that change Goal/boundary/judgment/required Verification. If the Human explicitly excludes a prior effort, its implementation conclusions/inventories/decomposition remain hypotheses only; any fact entering the Taskbook must be independently re-established from current authoritative reality. Compile is a symmetric output filter; remove any concrete list that one stable judgment + reality can reliably regenerate. Tasks are outcome + judgment units over the full same-shaped surface; unresolved Execution Unknowns do not automatically escalate to Human; Evidence does not default to per-symbol ledgers; candidate grep results are probes. Delegated defaults survive only when actually made and must expose decision/basis/cost-if-wrong/rollback. Human/repo branch/commit/push/PR execution discipline survives when present and is never invented. Persist execution state in exactly one durable carrier: prefer Human/repo or existing repo/runtime state and use implement-notes only as fallback. Verification freezes required proof. Completion includes success, three-failure stop-loss, trusted-baseline rollback, and anti-cheat. Autonomous Taskbooks default to ≤4000 characters. Taskbook delivery ends that Compile invocation; do not perform material Goal work, mutate the target workspace, or launch an Executor."