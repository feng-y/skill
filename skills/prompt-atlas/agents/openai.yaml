interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal, compile the task, leave How open"
  default_prompt: "Use $prompt-atlas. Settle the Goal the Human actually accepts, then compile the minimum-sufficient Taskbook for a fresh Executor. Inspect only reality that changes current judgment; after safe start, leave implementation How and verifier composition to the Executor. If context already contains an authoritative Taskbook plus Executor outcome/Evidence, verify completion against that same contract and current reality without recompiling the task or taking over execution."
