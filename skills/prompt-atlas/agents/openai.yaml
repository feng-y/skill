interface:
  display_name: "Prompt Atlas"
  short_description: "Take intent, compile executable output"
  default_prompt: "Use $prompt-atlas. First perform Intent take: absorb the Human's latest intent and recover the Goal they actually accept, binding constraints, authority boundaries, and material choices that still require Human authority. Only when a fresh Executor no longer needs to redo Human intent judgment and can safely begin material work, perform Intent compile and produce an executable Taskbook that can be advanced and proven directly rather than a Goal summary, task list, or patch plan. The Taskbook keeps Goal → Execution → Verification → Evidence; Execution must use the best-known Graph supported by current Evidence. After safe start, leave implementation How to the Executor and do not expand Research merely for Graph completeness. If context already contains an authoritative Taskbook plus Executor outcome/Evidence, judge against the Taskbook and current reality first; only verified new Evidence that changes remaining material work/dependencies may update the affected Graph / judgment cone and trigger full re-delivery without taking over execution."
