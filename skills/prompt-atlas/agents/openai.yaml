interface:
  display_name: "Prompt Atlas"
  short_description: "Settle Goal and generate an English taskbook with layered Verification and real Evidence"
  default_prompt: "Use $prompt-atlas. Prompt Atlas defines the task; it does not design the patch. Research only facts that change Goal/boundary/judgment/required Verification; Compile keeps only facts that change Executor decisions. Goal states outcome + decision priority + allowed/forbidden boundary + must-preserve. Tasks are outcome + judgment units over the full same-shaped surface, not file checklists; ordinary technical Unknowns stay with the Executor when Goal/boundary/priority already support a safe decision. Omit safely recomputable line/include/inventory detail and preserve traps whose omission would cause wrong judgment. `must/must not` comes only from Human/repo authority/verified reality. Evidence proves judgment and the completion claim rather than defaulting to per-file/per-symbol ledgers. Establish reproducible baselines; Verification freezes required proof, not debugging workflow. Completion includes success, a three-failure stop-loss, trusted-baseline rollback, and anti-cheat. Persist execution state in existing implement-notes. Autonomous Taskbooks default to ≤4000 characters. Taskbook delivery is terminal: do not perform material Goal work, mutate the target workspace, or launch an Executor. When the Human later asks to validate completed execution, reread the original Taskbook and rerun required Verification; judge without repairing in the same pass, and use a short independent-acceptance prompt only when the execution environment is unavailable."
