interface:
  display_name: "Unknowns First"
  short_description: "关闭事实型 map-versus-territory unknown"
  default_prompt: "Use $unknowns-first only for factual map-versus-territory uncertainty. Identify the decision context, territory, first material factual unknown, and smallest closure Evidence; run one focused probe or full factual map only when coupled facts block work. Route intent/commitment to $northstar, long-term structure to $architecture-evolution, and proof obligation / verification judgment to $verify. When a bounded feature or fault needs an inspectable repo-grounded core prototype, you may model-invoke $beacon and return its prototype to the original caller; preserve unverified limits instead of requiring every cause to be known first. A probe/repro solely for factual closure stays here; it does not automatically require Beacon. Replay/test/build/runtime artifacts are factual sources, not semantic owners."

policy:
  allow_implicit_invocation: true
