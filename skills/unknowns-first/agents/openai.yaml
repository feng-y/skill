interface:
  display_name: "Unknowns First"
  short_description: "关闭事实型 map-versus-territory unknown"
  default_prompt: "Use $unknowns-first only for factual map-versus-territory uncertainty. Identify the decision context, territory, first material factual unknown, and smallest closure Evidence; run one focused probe or full factual map only when coupled facts block work. Route intent/commitment to $northstar, long-term structure to $architecture-evolution, and proof obligation / verification judgment to $verify. If the factual gap is closed and the remaining issue is a materially different concrete path / usage / interface / interaction, you may model-invoke $prototype and return its concrete contrast to the original decision caller; Unknowns First does not own that shape decision. Replay/test/build/runtime artifacts are factual sources, not semantic owners."

policy:
  allow_implicit_invocation: true
