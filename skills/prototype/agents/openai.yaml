interface:
  display_name: "Prototype"
  short_description: "展开连贯工程形态，实做必要的可丢弃试验"
  default_prompt: "使用 $prototype，按 SKILL.md 围绕 caller 的当前问题展开一个连贯 concrete surface，或完成明确委托的可丢弃试验。选择足以回答问题的表示或实际运行，不用局部 HTML、未运行代码或计划替代约定实做，也不因形态已明确而提前退出。返回表示与观察给原 caller；Intent、Architecture、proof judgment 与生产实现仍归原 owner。"
