interface:
  display_name: "Architecture Evolution"
  short_description: "判断长期 Target 并收敛当前结构演进"
  default_prompt: "使用 $architecture-evolution，直接从当前 engineering request / existing Intent、仓库现实与仍有效的 architecture authority 建立或复用 Target Architecture，再判断 Current → Target 的 structural gap、focused Evolution Program 与 real exits；不要求先运行 Northstar，不从当前 module/patch 反推 Target，不设计 implementation How。AE 定义 structural semantics；需要证明 already-adopted structural claims 是否真实成立时交 $evidence，具体 Replay/test/build/runtime 只是 verifier backend。"
