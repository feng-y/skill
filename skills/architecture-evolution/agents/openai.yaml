interface:
  display_name: "Architecture Evolution"
  short_description: "从模块现实收敛目标架构与结构改进"
  default_prompt: "使用 $architecture-evolution。按调研 → 判断 → 写 Program → 交付推进：从指定模块或 capability 的 repo reality 与直接上下游重新识别 responsibility/boundary，当前 taxonomy 与 proposed shape 只作 Evidence；收敛 best-known Target Architecture 后，只保留最多 3 个完成即产生 structural gain + real exit 的 Architecture Improvements，并停在 Implementation Design 之前。成功 Program 以同一完整正文写入 repo/workspace 外的 handoff-authoritative Markdown file；Human clarification/correction 后重算受影响判断并完整重交付。"
