interface:
  display_name: "Architecture Evolution"
  short_description: "从模糊方向构造可验证的架构 Intent"
  default_prompt: "使用 $architecture-evolution。输入可以是历史模块、业务能力、模糊担忧或尚未说清的改进方向。先从真实变化压力和代码现实中判断是否存在架构 intent，再把一个方向收敛为 why now、desired end state、boundary、design obligations、关键 Unknown 和 success evidence。只构造 intent，不提前完成目标设计、实现计划或 Brooks 全量报告；一次只返回一个状态。"
