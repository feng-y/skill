interface:
  display_name: "Architecture Evolution"
  short_description: "从模糊方向构造有证据、有边界的架构 Intent"
  default_prompt: "使用 $architecture-evolution。输入可以是历史模块、业务能力、模糊担忧或尚未说清的改进方向。从真实 change pressure 和 repo evidence 判断 architecture vs local，收敛一个 bounded Architecture Intent；内部 judgement 与 Brooks 只用于裁决和 challenge，最终保持薄 Intent，并停在具体 Target Design 之前。"
