interface:
  display_name: "Architecture Evolution"
  short_description: "从指定模块收敛目标架构并编译可推进改进"
  default_prompt: "使用 $architecture-evolution。默认从用户指定模块开始，只沿直接 upstream/downstream 和会改变判断的 provider/boundary 渐进展开；先从真实职责重新识别 capability，再重新划 boundary 与 stable common/specific provider。用清晰分层与单向依赖、模块内聚与简洁组织、abstraction vs specific、primary vs auxiliary responsibility、real structural exit 收敛 Target Architecture；只有存在 materially different 的长期架构 fork 时才比较。ready 时不要返回完整 reasoning，而要 Compile 成薄 Architecture Program：结构调整、长期方向、最多 3 个真实 Architecture Improvements 与必要推进依赖。每个 improvement 必须带来确定结构收益、真实 exit 和 structural done condition；research/knowledge task 不能补数。停在具体 class/API/file/MR/task/verification 等 Implementation Design 之前。"
