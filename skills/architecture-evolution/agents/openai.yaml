interface:
  display_name: "Architecture Evolution"
  short_description: "从 change pressure 推演目标架构与演进决策"
  default_prompt: "使用 $architecture-evolution。输入可以是历史模块、业务能力、模糊担忧或下一步架构方向。从真实 change pressure 和 repo reality 重建关键 architecture forces 与最小 current architecture model；存在真实 fork 时比较 materially different Target Architecture 的 trade-off、complexity relocation 与 evolution cost，收敛 primary Architecture Decision。可以完成 responsibility/authority/knowledge/control/lifecycle/dependency/essential-variation 层面的 Target Architecture 与 architecture-level evolution，但停在具体 class/API/file/task/verification 等 Implementation Design 之前。"
