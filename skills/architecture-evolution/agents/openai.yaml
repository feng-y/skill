interface:
  display_name: "Architecture Evolution"
  short_description: "判断长期 Target 并收敛当前结构演进"
  default_prompt: "使用 $architecture-evolution，直接从当前 engineering request / existing Intent、仓库现实与仍有效的 architecture authority 建立或复用 Target Architecture，再判断 Current → Target 的 structural gap、focused Evolution Program 与 real exits；不要求先运行 Northstar，不从当前 module/patch 反推 Target，不设计 implementation How。若 structural question 已明确但 candidate Target 的一个 bounded caller path / usage / interface / boundary surface 仍存在 material concrete ambiguity，可 model-invoke $beacon，把 bounded concrete result 作为 reaction Evidence 返回 AE；Target judgment 仍由 AE 拥有。若 caller 是 Northstar，先把 scoped structural result 作为独立 return 交回，再由 Northstar 恢复 caller judgment、完成取舍与整体 Intent composition；不要把 AE return 与 Northstar final handoff 混成同一段回答。独立 AE 调用不强制经过 Northstar。Target-deciding premise 未关闭时只返回 conditional Target/blocker，并指定 authority source/next owner：事实 authority 交 Unknowns First，commitment 才回 Northstar/Human；不同时宣称 adopted Decision 或把 work 标为 execution-ready。需要验证 already-adopted structural claims 是否真实成立时交 $verify，具体 Replay/test/build/runtime 只是 backend。"
