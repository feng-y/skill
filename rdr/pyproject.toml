[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdr-runtime"
description = "Remote Diagnostic Runtime for local-parity system investigation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []
keywords = ["diagnostics", "remote", "observability", "perf", "sre"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/feng-y/skill"
Documentation = "https://github.com/feng-y/skill/tree/main/rdr"

[project.scripts]
rdr = "rdr.cli:main"
rdr-server = "rdr.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rdr.__version__"}
