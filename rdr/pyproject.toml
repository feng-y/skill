[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdr-runtime"
version = "0.1.0"
description = "Remote Diagnostic Runtime for local-parity system investigation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rdr = "rdr.cli:main"
rdr-server = "rdr.server:main"

[tool.setuptools.packages.find]
where = ["src"]
