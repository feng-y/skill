name: Prompt Atlas eval fixtures

on:
  pull_request:
    paths:
      - "skills/prompt-atlas/**"
      - "evals/prompt-atlas-smoke-v*/**"
      - "evals/prompt-atlas-leader-paired-v1/**"
      - ".github/workflows/prompt-atlas-evals.yml"
  push:
    branches:
      - main
    paths:
      - "skills/prompt-atlas/**"
      - "evals/prompt-atlas-smoke-v*/**"
      - "evals/prompt-atlas-leader-paired-v1/**"
      - ".github/workflows/prompt-atlas-evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation tools
        run: |
          python -m pip install --disable-pip-version-check "pytest==9.0.2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Compile validator
        run: python -m py_compile evals/prompt-atlas-leader-paired-v1/validate-fixtures.py
      - name: Validate preregistered fixtures
        run: python evals/prompt-atlas-leader-paired-v1/validate-fixtures.py
